name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: miui-24h-wallpaper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git add -f build.log
          git commit -m "ci build log" || true
          git push -f origin HEAD:ci-logs

      - name: Mark failure
        if: steps.build.outcome == 'failure'
        run: exit 1
