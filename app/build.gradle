plugins {
    id 'com.android.application'
}

def buildTime = new Date().format("yyyy-MM-dd HH:mm")

android {
    namespace 'com.paiennate.miui24h'
    compileSdk 34

    defaultConfig {
        applicationId "com.paiennate.miui24h"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Fixed keystore so every CI build shares the same signature
    // (lets you update in place without uninstalling / losing imported videos).
    signingConfigs {
        ci {
            storeFile file('keystore.jks')
            storePassword 'miui24h123'
            keyAlias 'miui24h'
            keyPassword 'miui24h123'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
        }
        release {
            signingConfig signingConfigs.ci
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
}
