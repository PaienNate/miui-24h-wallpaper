name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null || true

      - name: Build signed release APK
        run: |
          set -o pipefail
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/miui-24h-wallpaper-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.apk \
            --title "MIUI 24H 壁纸 ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
